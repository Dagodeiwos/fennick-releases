name: Bug report
description: Report a problem with a Fennick add-on
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: addon
    attributes:
      label: Add-on
      options: ["Core", "Guidepost", "Rest", "Reputation", "Merchant's Favor", "Trailmarks", "Cartographer"]
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version, placeholder: "e.g. 1.5.1"}
    validations: {required: true}
  - type: input
    id: language
    attributes: {label: Client language, placeholder: "e.g. enUS, deDE"}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, placeholder: "1. ...\n2. ...\n3. ..."}
    validations: {required: true}
  - type: textarea
    id: error
    attributes:
      label: Error text
      description: Type /console scriptErrors 1 in chat, reproduce the problem, then paste the error here.
      render: text
